# OLED-friendly lock screen: true black leaves OLED pixels off.
background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Keep the password field visible so a locked screen is never mistaken for a
# frozen or blank display.
input-field {
    monitor = DP-2
    size = 260, 54
    outline_thickness = 2
    rounding = 12

    inner_color = rgba(0, 0, 0, 0.92)
    outer_color = rgba(138, 138, 138, 0.70)
    font_color = rgba(224, 224, 224, 0.90)
    check_color = rgba(176, 176, 176, 0.85)
    fail_color = rgba(208, 128, 128, 0.85)

    fade_on_empty = false
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
}

general {
    hide_cursor = false
}

animations {
    enabled = false
}
