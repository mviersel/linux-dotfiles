# preload = ~/.config/backgrounds/blackGreenComputers.jpeg
# wallpaper = , ~/.config/backgrounds/blackGreenComputers.jpeg

# cover    → aspect ratio behouden, scherm volledig vullen, randen afsnijden
# contain  → hele afbeelding zichtbaar, maar met lege/zwarte randen
# fill     → volledig scherm vullen door te stretchen
# tile     → afbeelding herhalen

wallpaper {
monitor = DP-2
# path = ~/.config/backgrounds/cropped-lego-head.png
path = ~/.config/backgrounds/windowGirl_ultrawide.png
# fit_mode = fill
}

wallpaper {
monitor = DP-3
path = ~/.config/backgrounds/windowWithoutGirl.jpg
fit_mode = cover
}

wallpaper {
        monitor = HDMI-A-1
        path = ~/.config/backgrounds/windowWithoutGirl.jpg
        fit_mode = fill
    }

splash = false
ipc = off

